version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend:/app/backend

  # Wired in: set REDIS_URL (done above via `environment:`) and the backend
  # uses fusion/queue_backend.py's RedisQueueBackend automatically instead
  # of the in-process asyncio.Queue. This is what lets you eventually run
  # feed producers and the fusion worker as separate scaled-out services.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-facing URL — the browser runs on the host, not inside the
        # Docker network, so this must be a host-reachable address (the
        # backend's published port below), not the "backend" service name.
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
