name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest backend/app/tests -v
        env:
          # Makes test_redis_queue_correctness.py's reachability check
          # pass and actually run those tests here, instead of skipping
          # them — they only ran locally before this. test_persistence_postgres.py
          # still skips (no Postgres service configured) — verified
          # separately against a real local Postgres instance instead
          # (see the commit that added those tests).
          REDIS_URL: redis://localhost:6379/0

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Start backend (fast feed intervals so tracks populate quickly)
        run: |
          VEHICLE_IR_INTERVAL=0.5 UAV_UAS_INTERVAL=0.5 ELINT_INTERVAL=0.5 LEGACY_C2_INTERVAL=0.5 \
          nohup uvicorn backend.app.main:app --port 8000 > backend.log 2>&1 &
          sleep 3
          curl -sf http://localhost:8000/health

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 > frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5173 > /dev/null || (cat frontend.log && exit 1)

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Show backend log on failure
        if: failure()
        run: cat backend.log
