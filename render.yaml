# Render's native Python runtime, not the Dockerfile. The Python version
# comes from .python-version (3.12) at the repo root — do not remove it:
# asyncpg==0.29.0 ships no wheels past cp312, so on Render's current
# default (3.14) pip falls back to the sdist and the build dies compiling
# the C extension. Same failure this project already hit locally on 3.13.
services:
  - type: web
    name: sentinel-fft2ea-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false # set to your deployed Vercel frontend URL after first deploy
      - key: API_KEY
        sync: false # set a real secret before deploying — set VITE_API_KEY to match on Vercel
      - key: ENABLE_REAL_DETECTION
        value: "false" # keep off on Render free tier — torch/ultralytics won't fit the build
